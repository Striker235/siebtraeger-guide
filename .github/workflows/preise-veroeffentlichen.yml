# Veröffentlichung jeden Dienstag um 15:00 Uhr (Europe/Berlin).
# Ablauf: abrufen, Seite neu schreiben, prüfen, committen, veröffentlichen,
# live prüfen. Scheitert Abruf oder Prüfung, wird nichts veröffentlicht: Nur die
# Historie wird committet, die Live-Seite bleibt beim letzten Stand, und der
# Lauf öffnet ein Issue.
#
# Einstellungen unter Settings › Secrets and variables › Actions:
#   Variable DEPLOY_ZIEL: cloudflare oder netlify
#   Variable LIVE_URL: z. B. https://siebtraeger-guide.de
#   Cloudflare Pages: Secret CLOUDFLARE_API_TOKEN, Secret CLOUDFLARE_ACCOUNT_ID, Variable CF_PAGES_PROJEKT
#   Netlify: Secret NETLIFY_AUTH_TOKEN, Variable NETLIFY_SITE_ID
#   optional: Secret AWIN_FEED_OTTO
name: Preise veröffentlichen

on:
  schedule:
    - cron: "0 15 * * 2"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: preise
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 1. Preise abrufen und Seite schreiben
        id: crawler
        env:
          AWIN_FEED_OTTO: ${{ secrets.AWIN_FEED_OTTO }}
        run: |
          set +e
          python3 tools/preis-crawler.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 2. Seiten prüfen
        id: pruefung
        if: steps.crawler.outputs.code == '0'
        continue-on-error: true
        run: python3 tools/seiten-pruefen.py

      - name: Ergebnis festhalten
        id: ok
        env:
          CODE: ${{ steps.crawler.outputs.code }}
          PRUEFUNG: ${{ steps.pruefung.outcome }}
        run: |
          if [ "$CODE" = "0" ] && [ "$PRUEFUNG" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Crawler-Code $CODE, Prüfung $PRUEFUNG: kein Veröffentlichen, nur die Historie wird committet"
            git checkout -- data/preise.json src/
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 3. Commit
        env:
          OK: ${{ steps.ok.outputs.ok }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preis-historie.json data/preise.json src/
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            if [ "$OK" = "true" ]; then nachricht="Preise"; else nachricht="Preis-Historie"; fi
            git commit -m "$nachricht $(TZ=Europe/Berlin date +%F)"
            git pull --rebase
            git push
          fi

      - name: 4. Veröffentlichen
        if: steps.ok.outputs.ok == 'true'
        env:
          DEPLOY_ZIEL: ${{ vars.DEPLOY_ZIEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJEKT: ${{ vars.CF_PAGES_PROJEKT }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          case "$DEPLOY_ZIEL" in
            cloudflare)
              npx --yes wrangler@4 pages deploy src --project-name "$CF_PAGES_PROJEKT" --branch main --commit-dirty=true
              ;;
            netlify)
              npx --yes netlify-cli deploy --dir src --prod --site "$NETLIFY_SITE_ID" --no-build
              ;;
            *)
              echo "Variable DEPLOY_ZIEL fehlt (cloudflare oder netlify)"
              exit 1
              ;;
          esac

      - name: 5. Live prüfen
        if: steps.ok.outputs.ok == 'true'
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: python3 tools/live-pruefen.py

      - name: 6. Suchmaschinen informieren (IndexNow)
        # Nur gegen die echte Domain. Bei einem Probelauf auf die pages.dev-Adresse wird nichts gemeldet.
        if: steps.ok.outputs.ok == 'true' && (vars.LIVE_URL == '' || vars.LIVE_URL == 'https://siebtraeger-guide.de')
        run: python3 tools/indexnow.py

      - name: Issue bei Fehler
        if: failure() || steps.ok.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE: ${{ steps.crawler.outputs.code }}
          PRUEFUNG: ${{ steps.pruefung.outcome }}
        run: |
          gh issue create \
            --title "Preise veröffentlichen fehlgeschlagen $(TZ=Europe/Berlin date +%F)" \
            --body "Crawler-Code: ${CODE:-kein Ergebnis}. Seitenprüfung: ${PRUEFUNG:-nicht gelaufen}. Ohne bestandene Prüfung wurde nichts veröffentlicht. Log: $LAUF"
          exit 1

