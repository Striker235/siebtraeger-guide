# Täglicher Messlauf: Preise abrufen und nur data/preis-historie.json schreiben.
# Kein Veröffentlichen. Die Historie ist die Grundlage für den Tiefstpreis der
# letzten 30 Tage (§ 11 PAngV). Bei einem Fehler öffnet der Lauf ein Issue.
name: Preise messen

on:
  schedule:
    - cron: "17 5 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: preise
  cancel-in-progress: false

jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preise abrufen (nur Historie)
        id: crawler
        env:
          AWIN_FEED_OTTO: ${{ secrets.AWIN_FEED_OTTO }}
        run: |
          set +e
          python3 tools/preis-crawler.py --nur-historie
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Historie committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preis-historie.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Preis-Historie $(TZ=Europe/Berlin date +%F)"
            git pull --rebase
            git push
          fi

      - name: Issue bei Fehler
        if: failure() || steps.crawler.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE: ${{ steps.crawler.outputs.code }}
        run: |
          gh issue create \
            --title "Preise messen fehlgeschlagen $(TZ=Europe/Berlin date +%F)" \
            --body "Crawler-Code: ${CODE:-kein Ergebnis}. Code 2 heißt: weniger als die Hälfte der Quellen lieferte ein Ergebnis. Log: $LAUF"
          exit 1
