# Wächter dienstags um 17:30 Uhr (Europe/Berlin).
# GitHub kann geplante Läufe bei hoher Last verzögern oder auslassen. Gibt es
# heute keinen erfolgreichen und keinen laufenden Veröffentlichungslauf,
# startet der Wächter ihn nach. Scheitert der nachgestartete Lauf, öffnet er
# selbst ein Issue.
name: Preise Wächter

on:
  schedule:
    - cron: "30 17 * * 2"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Heutigen Veröffentlichungslauf suchen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          heute=$(date -u +%F)
          zaehlen() {
            gh run list --workflow preise-veroeffentlichen.yml --created ">=$heute" --status "$1" --json databaseId --jq length
          }
          erfolgreich=$(zaehlen success)
          laufend=$(( $(zaehlen in_progress) + $(zaehlen queued) ))
          if [ "$erfolgreich" -gt 0 ]; then
            echo "Heute erfolgreich veröffentlicht, nichts zu tun" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$laufend" -gt 0 ]; then
            echo "Veröffentlichungslauf läuft noch, nichts zu tun" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run preise-veroeffentlichen.yml --ref "$BRANCH"
            echo "Kein erfolgreicher Lauf heute: Veröffentlichung nachgestartet" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
